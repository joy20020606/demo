name: crypto-realtime-dashboard CI

on:
  push:
    branches: [main]
    paths:
      - 'project/crypto-realtime-dashboard/**'
      - '.github/workflows/crypto-realtime-dashboard-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'project/crypto-realtime-dashboard/**'
      - '.github/workflows/crypto-realtime-dashboard-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: project/crypto-realtime-dashboard

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: project/crypto-realtime-dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
