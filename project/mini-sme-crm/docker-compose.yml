services:
  postgres:
    image: postgres:16-alpine
    container_name: sme-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sme_crm
    ports:
      - "5432:5432"
    volumes:
      - sme-crm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sme_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sme-crm-pgdata:
