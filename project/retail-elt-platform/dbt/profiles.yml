retail_elt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'postgres') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'warehouse') }}"
      password: "{{ env_var('DBT_PASSWORD', 'warehouse') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'warehouse') }}"
      schema: analytics
      threads: 4
      keepalives_idle: 0
