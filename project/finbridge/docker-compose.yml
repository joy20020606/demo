services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finbridge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/finbridge
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8002:8000"

  mock_upstreams:
    build: ./backend
    command: ["uvicorn", "app.mock_upstreams.app:app", "--host", "0.0.0.0", "--port", "9001"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/finbridge
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "9001:9001"

volumes:
  pgdata:
