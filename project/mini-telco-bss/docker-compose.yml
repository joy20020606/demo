services:
  db:
    image: postgres:16-alpine
    container_name: telco-bss-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telco_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-telco_bss}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telco} -d ${POSTGRES_DB:-telco_bss}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: telco-bss-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telco-bss-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-telco}:${POSTGRES_PASSWORD:-telco_dev_pw}@db:5432/${POSTGRES_DB:-telco_bss}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:
