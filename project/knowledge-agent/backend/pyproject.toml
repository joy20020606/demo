[project]
name = "knowledge-agent-backend"
version = "0.1.0"
description = "知識庫問答 Agent — RAG + LangGraph backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "openai>=1.54",
    "anthropic>=0.39",
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "langchain-anthropic>=0.3",
    "pypdf>=5.1",
    "tiktoken>=0.8",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.3"]
eval = ["ragas>=0.2.6", "datasets>=3.1", "langchain-openai>=0.2.5"]
dev = ["pytest>=8.3", "ruff>=0.7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
