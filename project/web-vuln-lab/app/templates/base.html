<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vuln Lab</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #0f1117; color: #e6e6e6; }
    a { color: #6ea8fe; }
    input, button { font-size: 15px; padding: 8px; margin: 4px 0; }
    input { width: 100%; box-sizing: border-box; background: #1b1f2a; color: #e6e6e6; border: 1px solid #333; border-radius: 6px; }
    button { background: #2d6cdf; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .card { background: #161a23; padding: 20px; border-radius: 10px; border: 1px solid #262b36; }
    .flash { background: #3a1d1d; border: 1px solid #a33; padding: 8px 12px; border-radius: 6px; }
    .warn { font-size: 13px; color: #e0b050; }
    nav { margin-bottom: 20px; }
  </style>
</head>
<body>
  <nav>
    <a href="/">首頁</a>
    {% if session.get('username') %}
      · {{ session['username'] }}(<a href="/logout">登出</a>)
    {% else %}
      · <a href="/login">登入</a>
    {% endif %}
  </nav>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
  <p class="warn">⚠️ 故意有漏洞的教學靶機 — 僅限本機測試</p>
</body>
</html>
